<style>
  :root {
    --bg-dark: #0f172a; --bg-darker: #020617; --bg-card: #1e293b; --bg-input: #0f172a;
    --border: #334155; --text-main: #f1f5f9; --text-muted: #94a3b8;
    --blue: #3b82f6; --gold: #c9a961; --green: #22c55e; --red: #ef4444; --amber: #f59e0b;
  }
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
  body { font-family: 'Manrope', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }
  .font-display { font-family: 'Fraunces', serif; letter-spacing: -0.01em; }
  .bg-navy-gradient { background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e293b 100%); }
  .pattern-dots { background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
  .card-elevated { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -2px rgba(0,0,0,0.2); }
  .btn-primary { background: linear-gradient(135deg, var(--blue) 0%, #2563eb 100%); color: white; font-weight: 600; transition: all 0.2s ease; border: none; cursor: pointer; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text-main); border: 1px solid var(--border); font-weight: 500; transition: all 0.2s ease; cursor: pointer; }
  .btn-ghost:hover { background: var(--bg-darker); border-color: var(--text-muted); }
  .input-field { background: var(--bg-input); border: 1.5px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 15px; transition: all 0.2s ease; width: 100%; font-family: inherit; color: var(--text-main); }
  .input-field:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
  .input-field::placeholder { color: #64748b; }
  .declined { text-decoration: line-through; opacity: 0.45; color: var(--text-muted); }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fade-in 0.4s ease-out forwards; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-darker); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  .toast { animation: toast-slide 0.3s ease-out; }
  @keyframes toast-slide { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .phase-step-active { background: var(--blue); color: white; }
  .phase-step-pending { background: var(--border); color: var(--text-muted); }
  .nav-link { position: relative; padding: 8px 14px; color: var(--text-muted); font-weight: 500; font-size: 14px; transition: color 0.2s ease; cursor: pointer; text-decoration: none; display: inline-block; }
  .nav-link:hover { color: white; }
  .nav-link.active { color: white; }
  .nav-link.active::after { content: ''; position: absolute; bottom: -2px; left: 14px; right: 14px; height: 2px; background: var(--gold); border-radius: 1px; }
  .badge-cota-ampla { background: #1e3a8a; color: #bfdbfe; }
  .badge-cota-pcd { background: #78350f; color: #fde68a; }
  .badge-cota-pn { background: #14532d; color: #bbf7d0; }
  .status-pendente { background: #334155; color: #cbd5e1; }
  .status-sim { background: #14532d; color: #86efac; }
  .status-nao { background: #7f1d1d; color: #fca5a5; }
  .status-talvez { background: #78350f; color: #fcd34d; }
  .ornament-corner { position: absolute; width: 32px; height: 32px; border: 1px solid var(--gold); opacity: 0.3; pointer-events: none; }
  .ornament-corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .ornament-corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .ornament-corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .ornament-corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }
  .search-results { max-height: 280px; overflow-y: auto; }
  .search-result-item:hover { background: rgba(59,130,246,0.1); }
  .progress-bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
</style>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXX",
  authDomain: "seu-projeto.firebaseapp.com",
  databaseURL: "https://seu-projeto-default-rtdb.firebaseio.com",
  projectId: "seu-projeto",
  storageBucket: "seu-projeto.appspot.com",
  messagingSenderId: "XXXXXXXXXXXX",
  appId: "1:XXXXXXXXXXXX:web:XXXXXXXXXXXX"
};
let db = null, firebaseConnected = false;
try {
  if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('XXXX')) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }
} catch(e) { console.error("Firebase:", e); }

const SESSION_KEY = 'tjrs_portal_session';
const LOCAL_KEY = 'tjrs_portal_state_v3';
// IDs que NÃO aparecem como "próximo da fila" na home (ex: Ezequiel = ordem 1 = 'c1')
const FIXED_IDS = new Set(['c1']);

let state = { candidates: [], comarcas: [], phases: { phase1Open: true, phase2Open: false } };
let intentionsChart = null;
let currentView = 'home';
let dashboardFilters = { cota: 'Todos', intencao: 'Todos', search: '' };
let currentCandidateId = null;
let adminAuthenticated = false;

function cleanPhone(p) { return p ? p.replace(/\D/g, '') : ''; }

function parseData() {
  const oldIntentions = {};
  document.getElementById('rawDataOld').textContent.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
    const m = line.match(/^(\d+)\s+(\d+)\s+(SIM|NÃO)\s+(SIM|NÃO)\s+(.*?)\s+Aprovado\s*(.*)$/);
    if (m) {
      const nome = m[5].trim().replace(/\s+\d+(\s+\d+){0,3}$/, '').trim();
      const rest = m[6].trim();
      const fw = rest.split(/\s+/)[0].toLowerCase();
      const status = fw === 'sim' ? 'Sim' : (fw === 'não' || fw === 'nao') ? 'Nao' : fw === 'talvez' ? 'Talvez' : 'Pendente';
      if (status !== 'Pendente') oldIntentions[nome] = status;
    }
  });

  const candidates = [];
  document.getElementById('rawDataCSV').textContent.trim().split('\n')
    .filter(l => l.trim() && !l.startsWith('0 |'))
    .forEach(line => {
      const p = line.split('|').map(x => x.trim());
      if (p.length >= 5) {
        const [, classificacao, ordemStr, nome, cotaRaw] = p;
        const ordem = parseInt(ordemStr);
        const cota = cotaRaw.startsWith('PCD') ? 'PCD' : cotaRaw.startsWith('PNE') ? 'PN' : 'Ampla';
        candidates.push({ id: 'c'+ordem, classificacao, nome, cota, classificacaoGeral: ordem, status: oldIntentions[nome] || 'Pendente', telefone: '', email: '', comarcaEscolhida: null });
      }
    });

  try {
    const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
    if (saved && saved.candidates) {
      saved.candidates.forEach(s => {
        const c = candidates.find(x => x.id === s.id);
        if (c) { if(s.telefone) c.telefone=s.telefone; if(s.email) c.email=s.email; if(s.status) c.status=s.status; if(s.comarcaEscolhida) c.comarcaEscolhida=s.comarcaEscolhida; }
      });
      if (saved.phases) state.phases = saved.phases;
    }
  } catch(e) {}
  return { candidates, comarcas: [], phases: { phase1Open: true, phase2Open: false } };
}

function initApp() {
  state = parseData();
  const sess = sessionStorage.getItem(SESSION_KEY);
  if (sess && state.candidates.find(c => c.id === sess)) currentCandidateId = sess;
  render();
  if (db) {
    db.ref('state').once('value').then(snap => {
      const data = snap.val();
      if (!data) { db.ref('state').set(state).then(() => { firebaseConnected = true; }); }
      else { state = data; saveLocal(); const s = sessionStorage.getItem(SESSION_KEY); currentCandidateId = (s && state.candidates.find(c=>c.id===s)) ? s : null; render(); firebaseConnected = true; }
    }).catch(e => console.error(e));
    db.ref('state').on('value', snap => {
      if (firebaseConnected) { const data = snap.val(); if(data){ state=data; saveLocal(); const s=sessionStorage.getItem(SESSION_KEY); currentCandidateId=(s&&state.candidates.find(c=>c.id===s))?s:null; render(); } }
    });
  }
}

function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch(e) {} }

function updateState(path, value) {
  if (path.startsWith('candidates/')) { const [,id,field]=path.split('/'); const c=state.candidates.find(x=>x.id===id); if(c) c[field]=value; }
  else if (path.startsWith('phases/')) { state.phases[path.split('/')[1]] = value; }
  saveLocal(); render();
  if (db && firebaseConnected) db.ref('state/'+path).set(value).catch(e=>console.error(e));
}

function getActiveQueue() { return (state.candidates||[]).filter(c=>c.status!=='Nao'&&!c.comarcaEscolhida).sort((a,b)=>a.classificacaoGeral-b.classificacaoGeral); }

function getCurrentChooser() {
  return getActiveQueue().find(c => !FIXED_IDS.has(c.id)) || null;
}

function showToast(msg, type='info') {
  const colors = {success:'bg-green-600',error:'bg-red-600',info:'bg-blue-600',warning:'bg-amber-500'};
  const t = document.createElement('div');
  t.className = `toast ${colors[type]} text-white px-4 py-3 rounded-xl shadow-xl text-sm font-medium`;
  t.textContent = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

function navigate(view) {
  currentView = view;
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  document.querySelectorAll(`.nav-link[data-view="${view}"]`).forEach(l=>l.classList.add('active'));
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

function render() {
  const app = document.getElementById('app');
  if (!state.candidates || !state.candidates.length) {
    app.innerHTML = '<div class="flex justify-center items-center h-screen"><div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div></div>';
    return;
  }
  const views = { home: renderHome, candidate: renderCandidatePortal, dashboard: renderDashboard, admin: renderAdmin };
  app.innerHTML = (views[currentView] || renderHome)();
  if (currentView === 'home') attachHomeEvents();
  if (currentView === 'dashboard') renderCharts();
  const s = (db&&firebaseConnected)?'🔴 Ao vivo':'💾 Local';
  document.getElementById('footerStatus').textContent = `${state.candidates.length} candidatos · ${s}`;
}

// ============================================================
// HOME
// ============================================================
function renderHome() {
  const total = state.candidates.length;
  const sim = state.candidates.filter(c=>c.status==='Sim').length;
  const nao = state.candidates.filter(c=>c.status==='Nao').length;
  const pend = state.candidates.filter(c=>c.status==='Pendente').length;
  const pct = Math.round(((total-pend)/total)*100);
  const chooser = getCurrentChooser();
  return `
    <section class="relative bg-navy-gradient text-white overflow-hidden">
      <div class="absolute inset-0 pattern-dots opacity-40"></div>
      <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 lg:py-20">
        <div class="max-w-3xl fade-in">
          <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-900/50 border border-blue-700/50 text-blue-300 text-xs font-semibold mb-4 uppercase tracking-wider">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>Concurso de Oficial de Justiça · TJRS

function attachHomeEvents() {
  const search = document.getElementById('candidateSearch');
  const results = document.getElementById('searchResults');
  if (!search) return;
  search.addEventListener('input', e => {
    const q = e.target.value.toLowerCase().trim();
    if (q.length < 2) { results.classList.add('hidden'); return; }
    const matches = state.candidates.filter(c => c.nome.toLowerCase().includes(q) || String(c.classificacao).includes(q) || String(c.classificacaoGeral).includes(q)).slice(0, 30);
    if (!matches.length) { results.innerHTML = '<div class="p-3 text-sm text-slate-500">Nenhum candidato encontrado.</div>'; results.classList.remove('hidden'); return; }
    results.innerHTML = matches.map(c => `
      <div class="search-result-item p-3 cursor-pointer border-b border-slate-700/60 last:border-0 flex items-center justify-between gap-2 transition-colors" onclick="initCandidateAuth('${c.id}')">
        <div class="min-w-0">
          <div class="font-medium text-sm truncate text-slate-200">${c.nome}</div>
          <div class="text-xs text-slate-500 mt-0.5">Class. ${c.classificacao} · Ordem ${c.classificacaoGeral}º · ${c.cota} <span class="${c.telefone?'text-green-500':'text-blue-400'}">${c.telefone?'🔒 Cadastrado':'🆕 Primeiro acesso'}</span></div>
        </div>
        <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </div>`).join('');
    results.classList.remove('hidden');
  });
  document.addEventListener('click', e => { if (!search.contains(e.target) && !results.contains(e.target)) results.classList.add('hidden'); });
}

function saveFirstTimeAuth(e, id) {
  e.preventDefault();
  const phone = document.getElementById('regPhone').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  if (cleanPhone(phone).length < 8) { showToast('Telefone inválido (mínimo 8 dígitos).','warning'); return; }
  if (!email.includes('@')) { showToast('E-mail inválido.','warning'); return; }
  updateState(`candidates/${id}/telefone`, phone);
  updateState(`candidates/${id}/email`, email);
  currentCandidateId = id;
  sessionStorage.setItem(SESSION_KEY, id);
  closeModal();
  showToast('Cadastro realizado! Telefone registrado como senha.','success');
  navigate('candidate');
}

function verifyCandidatePhone(e, id) {
  e.preventDefault();
  const c = state.candidates.find(x => x.id === id);
  if (!c) { closeModal(); return; }
  const inp = cleanPhone(document.getElementById('authPhone').value.trim());
  const stored = cleanPhone(c.telefone);
  if (inp === stored && inp.length >= 8) {
    currentCandidateId = id;
    sessionStorage.setItem(SESSION_KEY, id);
    closeModal();
    showToast(`Bem-vindo(a), ${c.nome.split(' ')[0]}!`,'success');
    navigate('candidate');
  } else { showToast('Telefone incorreto. Apenas o titular pode alterar.','error'); }
}

function renderDashboard() {

  const pend = state.candidates.filter(c=>c.status==='Pendente').length;
  const total = state.candidates.length;
  const pct = Math.round(((total-pend)/total)*100);
  const sq = dashboardFilters.search || '';
  const filtered = state.candidates.filter(c => {
    if (dashboardFilters.cota !== 'Todos' && c.cota !== dashboardFilters.cota) return false;

        <h1 class="font-display text-2xl sm:text-3xl md:text-4xl font-bold text-white">Painel da Chamada</h1>
      </div>
      
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-5">
        <div class="card p-4"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">Total</div><div class="font-display text-2xl sm:text-3xl font-bold">${total}</div></div>
        <div class="card p-4 border-l-2 border-l-green-500"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">✓ Sim</div><div class="font-display text-2xl sm:text-3xl font-bold text-green-400">${sim}</div></div>
        <div class="card p-4 border-l-2 border-l-red-500"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">✕ Não</div><div class="font-display text-2xl sm:text-3xl font-bold text-red-400">${nao}</div></div>
        <div class="card p-4 border-l-2 border-l-amber-500"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">? Talvez</div><div class="font-display text-2xl sm:text-3xl font-bold text-amber-400">${talvez}</div></div>
        <div class="col-span-2 sm:col-span-1 card p-4 border-l-2 border-l-blue-400 bg-blue-900/10"><div class="text-[10px] text-blue-400 uppercase tracking-wider font-semibold mb-1">⏳ Pendentes</div><div class="font-display text-2xl sm:text-3xl font-bold text-blue-300">${pend}</div><div class="text-[10px] text-slate-500 mt-1">Sem resposta ainda</div></div>
      </div>

      <div class="card p-4 mb-5">
        <div class="flex justify-between text-xs text-slate-400 mb-2"><span>Progresso geral de respostas</span><span><strong class="text-white">${total-pend}</strong> / ${total} (${pct}%)</span></div>
        <div class="progress-bar"><div class="progress-fill bg-gradient-to-r from-blue-500 to-green-500" style="width:${pct}%"></div></div>
      </div>
      
      <div class="grid lg:grid-cols-2 gap-5 mb-5">
        <div class="card-elevated p-5 sm:p-6"><h3 class="font-display text-lg font-bold text-white mb-4">Distribuição de Intenções</h3><div style="height:240px"><canvas id="intentionsChart"></canvas></div></div>
        <div class="card-elevated p-5 sm:p-6"><h3 class="font-display text-lg font-bold text-white mb-4">Vagas por Comarca</h3><div class="flex items-center justify-center text-slate-500 text-sm text-center px-4" style="height:240px"><div><div class="text-4xl mb-3">🏛️</div>Comarcas ainda não disponibilizadas pelo Tribunal.</div></div></div>
      </div>
      
      <div class="card-elevated p-5 sm:p-6 mb-5">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
          <div><h3 class="font-display text-lg font-bold text-white">Lista Completa de Candidatos</h3><p class="text-xs text-slate-500 mt-0.5">${filtered.length} resultado(s)</p></div>
          <div class="flex flex-wrap gap-2 w-full sm:w-auto">
            <input type="text" id="dashSearch" value="${sq}" placeholder="Buscar por nome..." class="text-xs border border-slate-700 rounded-lg px-3 py-2 bg-slate-800 text-slate-300 w-full sm:w-44" oninput="setFilter('search',this.value)">
            <select onchange="setFilter('cota',this.value)" class="text-xs border border-slate-700 rounded-lg px-2 py-2 bg-slate-800 text-slate-300">
              <option value="Todos" ${dashboardFilters.cota==='Todos'?'selected':''}>Todas as Cotas</option>
              <option value="Ampla" ${dashboardFilters.cota==='Ampla'?'selected':''}>Ampla Conc.</option>
              <option value="PN" ${dashboardFilters.cota==='PN'?'selected':''}>Pretos/Negros (PN)</option>
              <option value="PCD" ${dashboardFilters.cota==='PCD'?'selected':''}>PCD</option>
            </select>
            <select onchange="setFilter('intencao',this.value)" class="text-xs border border-slate-700 rounded-lg px-2 py-2 bg-slate-800 text-slate-300">
              <option value="Todos" ${dashboardFilters.intencao==='Todos'?'selected':''}>Todas as Intenções</option>
              <option value="Sim" ${dashboardFilters.intencao==='Sim'?'selected':''}>✓ Sim</option>
              <option value="Nao" ${dashboardFilters.intencao==='Nao'?'selected':''}>✕ Não</option>
              <option value="Talvez" ${dashboardFilters.intencao==='Talvez'?'selected':''}>? Talvez</option>
              <option value="Pendente" ${dashboardFilters.intencao==='Pendente'?'selected':''}>⏳ Pendente</option>
            </select>
          </div>
        </div>
        <div class="table-responsive max-h-[600px] overflow-y-auto rounded-xl border border-slate-700">
          <table class="w-full text-sm">
            <thead class="sticky top-0 bg-slate-800 z-10">
              <tr class="text-left text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-700">
                <th class="py-3 px-3 font-semibold">Ordem</th>
                <th class="py-3 px-3 font-semibold">Candidato</th>
                <th class="py-3 px-2 font-semibold hidden sm:table-cell">Cota</th>
                <th class="py-3 px-2 font-semibold">Intenção</th>
                <th class="py-3 px-2 font-semibold hidden md:table-cell">Comarca</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map(c => `<tr class="border-b border-slate-700/50 hover:bg-slate-700/20 transition-colors">
                <td class="py-3 px-3 font-mono text-xs text-slate-500">${c.classificacaoGeral}º</td>
                <td class="py-3 px-3 font-medium ${c.status==='Nao'?'declined':''} max-w-[140px] sm:max-w-none">
                  <div class="truncate">${c.nome}</div>
                  <div class="text-[10px] text-slate-600 sm:hidden mt-0.5">${c.cota}</div>
                </td>
                <td class="py-3 px-2 hidden sm:table-cell"><span class="badge-cota-${c.cota.toLowerCase()} px-2 py-0.5 rounded text-[10px] font-medium">${c.cota}</span></td>
                <td class="py-3 px-2"><span class="status-${c.status.toLowerCase()} px-2 py-0.5 rounded text-[10px] font-medium">${c.status==='Nao'?'Não':c.status}</span></td>
                <td class="py-3 px-2 text-xs hidden md:table-cell ${c.comarcaEscolhida?'text-blue-400 font-semibold':'text-slate-600'}">${c.comarcaEscolhida||'—'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
      
      <div class="grid md:grid-cols-3 gap-5">
        ${renderCotaReport('Ampla','Ampla Concorrência')}
        ${renderCotaReport('PN','Pretos e Negros (PN)')}
        ${renderCotaReport('PCD','Pessoas com Def. (PCD)')}
      </div>
    </div>`;
}

function renderCotaReport(cotaType, title) {
  const list = state.candidates.filter(c=>c.cota===cotaType).sort((a,b)=>a.classificacaoGeral-b.classificacaoGeral);
  const sim=list.filter(c=>c.status==='Sim').length, nao=list.filter(c=>c.status==='Nao').length;
  const talvez=list.filter(c=>c.status==='Talvez').length, pend=list.filter(c=>c.status==='Pendente').length;
  return `
    <div class="card-elevated p-5">
      <h4 class="font-display text-base font-bold text-white mb-4">${title}</h4>
      <div class="grid grid-cols-4 gap-2 mb-4 text-center">
        <div class="bg-slate-800 rounded-lg p-2"><div class="text-[10px] text-slate-500 mb-0.5">Total</div><div class="font-bold text-sm">${list.length}</div></div>
        <div class="bg-green-900/30 rounded-lg p-2"><div class="text-[10px] text-green-500 mb-0.5">Sim</div><div class="font-bold text-sm text-green-400">${sim}</div></div>
        <div class="bg-red-900/30 rounded-lg p-2"><div class="text-[10px] text-red-500 mb-0.5">Não</div><div class="font-bold text-sm text-red-400">${nao}</div></div>
        <div class="bg-blue-900/20 rounded-lg p-2"><div class="text-[10px] text-blue-400 mb-0.5">Pend.</div><div class="font-bold text-sm text-blue-300">${pend}</div></div>
      </div>
      <div class="max-h-80 overflow-y-auto border border-slate-700/60 rounded-lg">
        <table class="w-full text-xs"><tbody>
          ${list.map(c=>`<tr class="border-b border-slate-700/40 hover:bg-slate-700/20 ${c.status==='Nao'?'declined':''}">
            <td class="py-2 px-2 font-mono text-slate-500 w-10">${c.classificacaoGeral}º</td>
            <td class="py-2 px-2 font-medium text-slate-300 max-w-[120px]"><div class="truncate">${c.nome}</div></td>
            <td class="py-2 px-2 text-right"><span class="status-${c.status.toLowerCase()} px-1.5 py-0.5 rounded text-[9px]">${c.status==='Nao'?'Não':c.status}</span></td>
          </tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;
}

function setFilter(type, value) { dashboardFilters[type] = value; render(); }

function renderCharts() {
  if (intentionsChart) { intentionsChart.destroy(); intentionsChart = null; }
  const canvas = document.getElementById('intentionsChart');
  if (!canvas) return;
  const data = ['Sim','Nao','Talvez','Pendente'].map(s => state.candidates.filter(c=>c.status===s).length);
  intentionsChart = new Chart(canvas, {
    type: 'doughnut',
    data: { labels: ['Sim','Não','Talvez','Pendente'], datasets: [{ data, backgroundColor: ['#22c55e','#ef4444','#f59e0b','#3b82f6'], borderWidth: 2, borderColor: '#1e293b' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 12, font: { size: 11 } } } }, cutout: '68%' }
  });
}

// ============================================================
// ADMINISTRADOR
// ============================================================
const ADMIN_PASSWORD = 'pombos';
function renderAdmin() { return adminAuthenticated ? renderAdminPanel() : renderAdminLogin(); }

function renderAdminLogin() {
  return `
    <div class="max-w-md mx-auto px-4 py-12 sm:py-16 fade-in">
      <div class="card-elevated p-8 relative overflow-hidden">
        <div class="ornament-corner tl"></div><div class="ornament-corner tr"></div><div class="ornament-corner bl"></div><div class="ornament-corner br"></div>
        <div class="text-center mb-6">
          <div class="w-16 h-16 mx-auto rounded-full bg-slate-800 flex items-center justify-center mb-4 border border-slate-700">
            <svg class="w-8 h-8 text-[#c9a961]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          </div>
          <h1 class="font-display text-2xl font-bold text-white">Painel Administrativo</h1>
          <p class="text-slate-500 text-xs mt-2">Acesso restrito ao administrador</p>
        </div>
        <div class="space-y-4">
          <input type="password" id="adminPassword" class="input-field" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')loginAdmin()">
          <button onclick="loginAdmin()" class="btn-primary w-full py-3.5 rounded-xl font-semibold">Acessar</button>
        </div>
      </div>
    </div>`;
}

function loginAdmin() {
  if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) { adminAuthenticated = true; showToast('Acesso liberado!','success'); render(); }
  else showToast('Senha incorreta.','error');
}
function logoutAdmin() { adminAuthenticated = false; navigate('home'); }

function renderAdminPanel() {
  const sim=state.candidates.filter(c=>c.status==='Sim').length;
  const nao=state.candidates.filter(c=>c.status==='Nao').length;
  const talvez=state.candidates.filter(c=>c.status==='Talvez').length;
  const pend=state.candidates.filter(c=>c.status==='Pendente').length;
  const cadastrados=state.candidates.filter(c=>c.telefone).length;
  return `
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 fade-in">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
        <div><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">Acesso Restrito</div><h1 class="font-display text-2xl sm:text-3xl font-bold text-white">Painel do Administrador</h1></div>
        <button onclick="logoutAdmin()" class="btn-ghost text-sm px-4 py-2 rounded-lg">Sair</button>
      </div>
      
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-5">
        <div class="card p-4 text-center"><div class="text-[10px] text-slate-500 mb-1">Total</div><div class="font-display text-2xl font-bold">${state.candidates.length}</div></div>
        <div class="card p-4 text-center border-l-2 border-l-green-500"><div class="text-[10px] text-slate-500 mb-1">Sim</div><div class="font-display text-2xl font-bold text-green-400">${sim}</div></div>
        <div class="card p-4 text-center border-l-2 border-l-red-500"><div class="text-[10px] text-slate-500 mb-1">Não</div><div class="font-display text-2xl font-bold text-red-400">${nao}</div></div>
        <div class="card p-4 text-center border-l-2 border-l-amber-500"><div class="text-[10px] text-slate-500 mb-1">Talvez</div><div class="font-display text-2xl font-bold text-amber-400">${talvez}</div></div>
        <div class="col-span-2 sm:col-span-1 card p-4 text-center border-l-2 border-l-blue-400 bg-blue-900/10"><div class="text-[10px] text-blue-400 mb-1">⏳ Pendentes</div><div class="font-display text-2xl font-bold text-blue-300">${pend}</div></div>
      </div>
      
      <div class="card-elevated p-5 sm:p-6 mb-5">
        <h3 class="font-display text-lg font-bold text-white mb-4">⚙️ Controle de Fases</h3>
        <div class="grid sm:grid-cols-2 gap-4">
          ${['phase1Open:Fase 1 — Intenção de Posse','phase2Open:Fase 2 — Escolha de Comarca'].map(x => {
            const [key, label] = x.split(':');
            const on = state.phases[key];
            return `<div class="flex items-center justify-between p-4 border border-slate-700 rounded-xl">
              <div><div class="font-semibold text-sm text-white">${label}</div><div class="text-xs text-slate-500 mt-0.5">${on?'● Aberta':'○ Encerrada'}</div></div>
              <label class="relative inline-flex items-center cursor-pointer ml-4"><input type="checkbox" ${on?'checked':''} onchange="togglePhase('${key}',this.checked)" class="sr-only peer"><div class="w-11 h-6 bg-slate-700 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div></label>
            </div>`;
          }).join('')}
        </div>
      </div>
      
      <div class="card-elevated p-5 sm:p-6 mb-5">
        <h3 class="font-display text-lg font-bold text-white mb-2">📊 Exportar Relatório</h3>
        <p class="text-xs text-slate-400 mb-4">Planilha CSV com todos os dados: ordens, respostas, telefones, e-mails e comarcas.</p>
        <div class="flex flex-wrap gap-3">
          <button onclick="exportReport()" class="btn-primary px-5 py-2.5 rounded-lg text-sm">📥 Exportar CSV Completo</button>
          <button onclick="exportPendentes()" class="btn-ghost px-5 py-2.5 rounded-lg text-sm">⏳ Exportar Apenas Pendentes (${pend})</button>
        </div>
      </div>
      
      <div class="card-elevated p-5 sm:p-6">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
          <h3 class="font-display text-lg font-bold text-white">👥 Gerenciar Candidatos</h3>
          <div class="text-xs text-slate-500">${cadastrados} de ${state.candidates.length} com cadastro completo</div>
        </div>
        <div class="table-responsive max-h-[500px] overflow-y-auto border border-slate-700 rounded-xl">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-700 sticky top-0 bg-slate-800 z-10">
                <th class="py-3 px-3">#</th>
                <th class="py-3 px-3">Nome</th>
                <th class="py-3 px-2 hidden sm:table-cell">Cota</th>
                <th class="py-3 px-2 hidden md:table-cell">Telefone</th>
                <th class="py-3 px-2 hidden lg:table-cell">E-mail</th>
                <th class="py-3 px-2">Status</th>
              </tr>
            </thead>
            <tbody>
              ${state.candidates.map(c=>`
                <tr class="border-b border-slate-700/50 hover:bg-slate-700/20 transition-colors">
                  <td class="py-2.5 px-3 font-mono text-xs text-slate-500">${c.classificacaoGeral}º</td>
                  <td class="py-2.5 px-3">
                    <div class="font-medium text-slate-200 text-xs leading-tight max-w-[140px] sm:max-w-[200px] lg:max-w-none truncate">${c.nome}</div>
                    <div class="text-[10px] text-slate-600 mt-0.5 sm:hidden">${c.cota} · ${c.telefone||'sem tel.'}</div>
                  </td>
                  <td class="py-2.5 px-2 hidden sm:table-cell"><span class="badge-cota-${c.cota.toLowerCase()} px-2 py-0.5 rounded text-[10px] font-medium">${c.cota}</span></td>
                  <td class="py-2.5 px-2 text-xs font-mono text-slate-400 hidden md:table-cell">${c.telefone||'<span class="text-slate-600">—</span>'}</td>
                  <td class="py-2.5 px-2 text-xs text-slate-400 hidden lg:table-cell max-w-[160px] truncate">${c.email||'<span class="text-slate-600">—</span>'}</td>
                  <td class="py-2.5 px-2">
                    <select onchange="updateCandidateStatus('${c.id}',this.value)" class="text-xs border border-slate-700 rounded-lg px-2 py-1.5 bg-slate-800 text-slate-300">
                      <option value="Pendente" ${c.status==='Pendente'?'selected':''}>⏳ Pendente</option>
                      <option value="Sim" ${c.status==='Sim'?'selected':''}>✓ Sim</option>
                      <option value="Nao" ${c.status==='Nao'?'selected':''}>✕ Não</option>
                      <option value="Talvez" ${c.status==='Talvez'?'selected':''}>? Talvez</option>
                    </select>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

function togglePhase(phase, value) { updateState('phases/'+phase, value); }
function updateCandidateStatus(id, status) { updateState(`candidates/${id}/status`, status); }

function exportReport() {
  const rows = [...state.candidates].sort((a,b)=>a.classificacaoGeral-b.classificacaoGeral).map(c=>
    [c.classificacaoGeral,c.classificacao,c.nome,c.cota,c.telefone||'',c.email||'',c.status,c.comarcaEscolhida||'']);
  const csv = ['OrdemNomeacao;Classificacao;Nome;Cota;Telefone;Email;Status;Comarca',
    ...rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'))].join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'})); a.download='relatorio_tjrs_completo.csv'; a.click();
  showToast('Relatório exportado!','success');
}

function exportPendentes() {
  const pend = [...state.candidates].filter(c=>c.status==='Pendente').sort((a,b)=>a.classificacaoGeral-b.classificacaoGeral);
  if (!pend.length) { showToast('Nenhum pendente!','info'); return; }
  const rows = pend.map(c=>[c.classificacaoGeral,c.classificacao,c.nome,c.cota,c.telefone||'',c.email||'']);
  const csv = ['OrdemNomeacao;Classificacao;Nome;Cota;Telefone;Email',
    ...rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'))].join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'})); a.download=`pendentes_tjrs_${pend.length}.csv`; a.click();
  showToast(`${pend.length} pendente(s) exportado(s)!`,'success');
}

initApp();
</script>
</body>
</html>
