<style>
  :root {
    --bg-dark: #0f172a; --bg-darker: #020617; --bg-card: #1e293b; --bg-input: #0f172a;
    --border: #334155; --text-main: #f1f5f9; --text-muted: #94a3b8;
    --blue: #3b82f6; --blue-light: #60a5fa; --gold: #c9a961;
    --green: #22c55e; --red: #ef4444; --amber: #f59e0b;
  }
  * { -webkit-font-smoothing: antialiased; }
  body { font-family: 'Manrope', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }
  .font-display { font-family: 'Fraunces', serif; letter-spacing: -0.01em; }
  .bg-navy-gradient { background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e293b 100%); }
  .pattern-dots { background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 24px 24px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
  .card-elevated { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -2px rgba(0,0,0,0.2); }
  .btn-primary { background: linear-gradient(135deg, var(--blue) 0%, #2563eb 100%); color: white; font-weight: 600; transition: all 0.2s ease; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text-main); border: 1px solid var(--border); font-weight: 500; transition: all 0.2s ease; }
  .btn-ghost:hover { background: var(--bg-darker); border-color: var(--text-muted); }
  .input-field { background: var(--bg-input); border: 1.5px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 15px; transition: all 0.2s ease; width: 100%; font-family: inherit; color: var(--text-main); }
  .input-field:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
  .input-field::placeholder { color: #64748b; }
  .declined { text-decoration: line-through; opacity: 0.45; color: var(--text-muted); }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fade-in 0.4s ease-out forwards; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-darker); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  .toast { animation: toast-slide 0.3s ease-out; }
  @keyframes toast-slide { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .phase-step-active { background: var(--blue); color: white; }
  .phase-step-pending { background: var(--border); color: var(--text-muted); }
  .nav-link { position: relative; padding: 8px 14px; color: var(--text-muted); font-weight: 500; font-size: 14px; transition: color 0.2s ease; cursor: pointer; }
  .nav-link:hover { color: white; }
  .nav-link.active { color: white; }
  .nav-link.active::after { content: ''; position: absolute; bottom: -2px; left: 14px; right: 14px; height: 2px; background: var(--gold); border-radius: 1px; }
  .badge-cota-ampla { background: #1e3a8a; color: #bfdbfe; }
  .badge-cota-pcd { background: #78350f; color: #fde68a; }
  .badge-cota-pn { background: #14532d; color: #bbf7d0; }
  .status-pendente { background: #334155; color: #cbd5e1; }
  .status-sim { background: #14532d; color: #86efac; }
  .status-nao { background: #7f1d1d; color: #fca5a5; }
  .status-talvez { background: #78350f; color: #fcd34d; }
  .queue-row-current { background: linear-gradient(90deg, rgba(34, 197, 94, 0.1), transparent); border-left: 3px solid var(--green); }
  .ornament-corner { position: absolute; width: 32px; height: 32px; border: 1px solid var(--gold); opacity: 0.3; pointer-events: none; }
  .ornament-corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .ornament-corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .ornament-corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .ornament-corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }
  .search-results { max-height: 280px; overflow-y: auto; }
  .search-result-item:hover { background: rgba(59, 130, 246, 0.1); }
</style>

<script>
// =================================================================
// CONFIGURAÇÃO DO FIREBASE (Chaves configuráveis)
// =================================================================
const firebaseConfig = {
  apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXX",
  authDomain: "seu-projeto.firebaseapp.com",
  databaseURL: "https://seu-projeto-default-rtdb.firebaseio.com",
  projectId: "seu-projeto",
  storageBucket: "seu-projeto.appspot.com",
  messagingSenderId: "XXXXXXXXXXXX",
  appId: "1:XXXXXXXXXXXX:web:XXXXXXXXXXXX"
};

let db = null;
let firebaseConnected = false;

try {
  if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('XXXX')) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }
} catch (e) {
  console.error("Erro ao inicializar Firebase:", e);
}
// =================================================================

const SESSION_KEY = 'tjrs_portal_session';
const LOCAL_STORAGE_KEY = 'tjrs_portal_state_v2';

let state = {
  candidates: [],
  comarcas: [],
  phases: { phase1Open: true, phase2Open: false }
};

let intentionsChart = null;
let currentView = 'home';
let dashboardFilters = { cota: 'Todos', intencao: 'Todos' };
let currentCandidateId = null;
let adminAuthenticated = false;

function cleanPhone(phone) {
  if (!phone) return '';
  return phone.replace(/\D/g, '');
}

function parseData() {
  const oldIntentions = {};
  const oldText = document.getElementById('rawDataOld').textContent;
  const oldLines = oldText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  
  oldLines.forEach(line => {
    const match = line.match(/^(\d+)\s+(\d+)\s+(SIM|NÃO)\s+(SIM|NÃO)\s+(.*?)\s+Aprovado\s*(.*)$/);
    if (match) {
      let nome = match[5].trim().replace(/\s+\d+(\s+\d+){0,3}$/, '').trim();
      const rest = match[6].trim();
      let status = 'Pendente';
      const firstWord = rest.split(/\s+/)[0].toLowerCase();
      if (firstWord === 'sim') status = 'Sim';
      else if (firstWord === 'não' || firstWord === 'nao') status = 'Nao';
      else if (firstWord === 'talvez') status = 'Talvez';
      if (status !== 'Pendente') oldIntentions[nome] = status;
    }
  });

  const csvText = document.getElementById('rawDataCSV').textContent;
  const csvLines = csvText.trim().split('\n').filter(l => l.trim() && !l.startsWith('0 |'));
  const candidates = [];
  
  csvLines.forEach(line => {
    const parts = line.split('|').map(p => p.trim());
    if (parts.length >= 5) {
      const classificacao = parts[1];
      const ordem = parseInt(parts[2]);
      const nome = parts[3];
      const cotaRaw = parts[4];
      
      let cota = 'Ampla';
      if (cotaRaw.startsWith('PCD')) cota = 'PCD';
      else if (cotaRaw.startsWith('PNE')) cota = 'PN';
      
      const status = oldIntentions[nome] || 'Pendente';
      
      candidates.push({
        id: 'c' + ordem,
        classificacao: classificacao,
        nome: nome,
        cota: cota,
        classificacaoGeral: ordem,
        status: status,
        telefone: '',
        email: '',
        comarcaEscolhida: null,
        escolheuEm: null
      });
    }
  });

  try {
    const savedLocal = localStorage.getItem(LOCAL_STORAGE_KEY);
    if (savedLocal) {
      const parsedLocal = JSON.parse(savedLocal);
      if (parsedLocal.candidates && parsedLocal.candidates.length > 0) {
        parsedLocal.candidates.forEach(localCand => {
          const match = candidates.find(c => c.id === localCand.id);
          if (match) {
            if (localCand.telefone) match.telefone = localCand.telefone;
            if (localCand.email) match.email = localCand.email;
            if (localCand.status) match.status = localCand.status;
            if (localCand.comarcaEscolhida) match.comarcaEscolhida = localCand.comarcaEscolhida;
          }
        });
      }
      if (parsedLocal.phases) {
        state.phases = parsedLocal.phases;
      }
    }
  } catch(e) {
    console.error("Erro ao ler localStorage:", e);
  }
  
  return {
    candidates: candidates,
    comarcas: [],
    phases: { phase1Open: true, phase2Open: false }
  };
}

function initApp() {
  state = parseData();
  
  const session = sessionStorage.getItem(SESSION_KEY);
  if (session && state.candidates.find(c => c.id === session)) {
    currentCandidateId = session;
  }
  
  render();
  
  if (db) {
    db.ref('state').once('value').then(snapshot => {
      const data = snapshot.val();
      if (!data) {
        db.ref('state').set(state).then(() => {
          firebaseConnected = true;
        }).catch(err => {
          console.error("Erro ao gravar no Firebase:", err);
        });
      } else {
        state = data;
        saveLocalBackup();
        const session = sessionStorage.getItem(SESSION_KEY);
        if (session && state.candidates.find(c => c.id === session)) {
          currentCandidateId = session;
        } else {
          currentCandidateId = null;
        }
        render();
        firebaseConnected = true;
      }
    }).catch(err => {
      console.error("Permissão Firebase:", err);
    });
    
    db.ref('state').on('value', (snapshot) => {
      if (firebaseConnected) {
        const data = snapshot.val();
        if (data) {
          state = data;
          saveLocalBackup();
          const session = sessionStorage.getItem(SESSION_KEY);
          if (session && state.candidates.find(c => c.id === session)) {
            currentCandidateId = session;
          } else {
            currentCandidateId = null;
          }
          render();
        }
      }
    });
  }
}

function saveLocalBackup() {
  try {
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function updateState(path, value) {
  if (path.startsWith('candidates/')) {
    const parts = path.split('/');
    const id = parts[1];
    const field = parts[2];
    const cand = state.candidates.find(c => c.id === id);
    if (cand) cand[field] = value;
  } else if (path.startsWith('phases/')) {
    const phase = path.split('/')[1];
    state.phases[phase] = value;
  }
  
  saveLocalBackup();
  render();

  if (db && firebaseConnected) {
    db.ref('state/' + path).set(value).catch(err => {
      console.error("Erro ao salvar no Firebase:", err);
    });
  }
}

function getActiveQueue() {
  if (!state.candidates) return [];
  return state.candidates
    .filter(c => c.status !== 'Nao' && !c.comarcaEscolhida)
    .sort((a, b) => a.classificacaoGeral - b.classificacaoGeral);
}

function getCurrentChooser() {
  const queue = getActiveQueue();
  return queue.length > 0 ? queue[0] : null;
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-amber-500' };
  const toast = document.createElement('div');
  toast.className = `toast ${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-start gap-3 max-w-sm`;
  toast.innerHTML = `<div class="text-sm font-medium flex-1">${message}</div>`;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 4000);
}

function navigate(view) {
  currentView = view;
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll(`.nav-link[data-view="${view}"]`).forEach(l => l.classList.add('active'));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
}

function render() {
  const app = document.getElementById('app');
  if (!state.candidates || state.candidates.length === 0) {
    app.innerHTML = `<div class="flex justify-center items-center h-screen"><div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div></div>`;
    document.getElementById('footerStatus').textContent = 'Carregando dados...';
    return;
  }
  
  let html = '';
  if (currentView === 'home') html = renderHome();
  else if (currentView === 'candidate') html = renderCandidatePortal();
  else if (currentView === 'dashboard') html = renderDashboard();
  else if (currentView === 'admin') html = renderAdmin();
  
  app.innerHTML = html;
  
  if (currentView === 'home') attachHomeEvents();
  if (currentView === 'dashboard') renderCharts();
  
  const dbStatus = (db && firebaseConnected) ? 'Sincronizado' : 'Modo Local Protegido';
  document.getElementById('footerStatus').textContent = `${state.candidates.length} candidatos · ${dbStatus}`;
}

function attachHomeEvents() {
  const search = document.getElementById('candidateSearch');
  const results = document.getElementById('searchResults');
  if (!search) return;
  
  search.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (q.length < 2) { results.classList.add('hidden'); return; }
    
    const matches = state.candidates.filter(c => 
      c.nome.toLowerCase().includes(q) || String(c.classificacao).includes(q)
    ).slice(0, 30);
    
    if (matches.length === 0) {
      results.innerHTML = '<div class="p-3 text-sm text-slate-500">Nenhum candidato encontrado.</div>';
      results.classList.remove('hidden');
      return;
    }
    
    results.innerHTML = matches.map(c => `
      <div class="search-result-item p-3 cursor-pointer border-b border-slate-700 last:border-0 flex items-center justify-between gap-2" onclick="initCandidateAuth('${c.id}')">
        <div class="min-w-0">
          <div class="font-medium text-sm truncate text-slate-200">${c.nome}</div>
          <div class="text-xs text-slate-500">Class. ${c.classificacao} · Ordem ${c.classificacaoGeral}º · ${c.cota} ${c.telefone ? '🔒 Autenticado' : '🆕 Primeiro acesso'}</div>
        </div>
        <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </div>
    `).join('');
    results.classList.remove('hidden');
  });
  
  document.addEventListener('click', (e) => {
    if (!search.contains(e.target) && !results.contains(e.target)) results.classList.add('hidden');
  });
}

function saveFirstTimeAuth(event, candidateId) {
  event.preventDefault();
  const phone = document.getElementById('regPhone').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  
  if (cleanPhone(phone).length < 8) {
    showToast('Informe um número de telefone válido (mínimo 8 dígitos).', 'warning');
    return;
  }
  if (!email || !email.includes('@')) {
    showToast('Informe um endereço de e-mail válido.', 'warning');
    return;
  }
  
  updateState(`candidates/${candidateId}/telefone`, phone);
  updateState(`candidates/${candidateId}/email`, email);
  
  currentCandidateId = candidateId;
  sessionStorage.setItem(SESSION_KEY, candidateId);
  closeModal();
  showToast(`Cadastro efetuado! Seu telefone foi registrado como senha.`, 'success');
  navigate('candidate');
}

function verifyCandidatePhone(event, candidateId) {
  event.preventDefault();
  const inputPhone = document.getElementById('authPhone').value.trim();
  const c = state.candidates.find(x => x.id === candidateId);
  
  if (!c) {
    closeModal();
    return;
  }
  
  const cleanInput = cleanPhone(inputPhone);
  const cleanStored = cleanPhone(c.telefone);
  
  if (cleanInput === cleanStored && cleanInput.length >= 8) {
    currentCandidateId = c.id;
    sessionStorage.setItem(SESSION_KEY, c.id);
    closeModal();
    showToast(`Autenticação bem-sucedida! Bem-vindo(a), ${c.nome.split(' ')[0]}.`, 'success');
    navigate('candidate');
  } else {
    showToast('Telefone incorreto! Apenas o titular pode alterar a decisão.', 'error');
  }
}

function saveUpdatedContact(event, candidateId) {
  event.preventDefault();
  const phone = document.getElementById('editPhone').value.trim();
  const email = document.getElementById('editEmail').value.trim();
  
  if (cleanPhone(phone).length < 8) {
    showToast('Informe um telefone válido.', 'warning');
    return;
  }
  
  updateState(`candidates/${candidateId}/telefone`, phone);
  updateState(`candidates/${candidateId}/email`, email);
  closeModal();
  showToast('Contatos atualizados com sucesso!', 'success');
}

function setCandidateStatus(status) {
  const c = state.candidates.find(x => x.id === currentCandidateId);
  if (!c || !state.phases.phase1Open) return;
  updateState(`candidates/${c.id}/status`, status);
  showToast(`Intenção atualizada: ${status === 'Sim' ? 'SIM' : status === 'Nao' ? 'NÃO' : 'TALVEZ'}`, 'success');
}

function logoutCandidate() {
  currentCandidateId = null;
  sessionStorage.removeItem(SESSION_KEY);
  showToast('Você encerrou a sessão.', 'info');
  navigate('home');
}

function renderDashboard() {
  const intentions = {
    Sim: state.candidates.filter(c => c.status === 'Sim').length,
    Nao: state.candidates.filter(c => c.status === 'Nao').length,
    Talvez: state.candidates.filter(c => c.status === 'Talvez').length,
    Pendente: state.candidates.filter(c => c.status === 'Pendente').length
  };
  
  const filteredQueue = state.candidates.filter(c => {
    if (dashboardFilters.cota !== 'Todos' && c.cota !== dashboardFilters.cota) return false;
    if (dashboardFilters.intencao !== 'Todos' && c.status !== dashboardFilters.intencao) return false;
    return true;
  }).sort((a, b) => a.classificacaoGeral - b.classificacaoGeral);
  
  return `
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in">
      <div class="mb-6">
        <div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1 flex items-center gap-2"><span class="w-6 h-px bg-[#c9a961]"></span>Transparência Pública</div>
        <h1 class="font-display text-3xl md:text-4xl font-bold text-white">Painel da Chamada</h1>
      </div>
      
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="card p-4"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Total Aprovados</div><div class="font-display text-3xl font-bold text-white">${state.candidates.length}</div></div>
        <div class="card p-4"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Intenção Sim</div><div class="font-display text-3xl font-bold text-green-400">${intentions.Sim}</div></div>
        <div class="card p-4"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Recusaram</div><div class="font-display text-3xl font-bold text-red-400">${intentions.Nao}</div></div>
        <div class="card p-4"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Talvez</div><div class="font-display text-3xl font-bold text-amber-400">${intentions.Talvez}</div></div>
      </div>
      
      <div class="grid lg:grid-cols-2 gap-6 mb-6">
        <div class="card-elevated p-6"><h3 class="font-display text-lg font-bold text-white mb-4">Intenção de Posse</h3><div class="relative h-64"><canvas id="intentionsChart"></canvas></div></div>
        <div class="card-elevated p-6">
          <h3 class="font-display text-lg font-bold text-white mb-4">Vagas por Comarca</h3>
          <div class="relative h-64 flex items-center justify-center text-slate-500 text-sm text-center px-4">
            ${state.comarcas.length === 0 ? 'Comarcas ainda não disponibilizadas pelo Tribunal.' : '<canvas id="comarcasChart"></canvas>'}
          </div>
        </div>
      </div>
      
      <div class="card-elevated p-6 mb-6">
        <div class="flex items-center justify-between mb-4 flex-wrap gap-4">
          <div><h3 class="font-display text-lg font-bold text-white">Fila Dinâmica</h3><p class="text-xs text-slate-500">Aplique os filtros para visualizar grupos específicos.</p></div>
          <div class="flex flex-wrap gap-2">
            <select onchange="setFilter('cota', this.value)" class="text-xs border border-slate-700 rounded px-2 py-1.5 bg-slate-800 text-slate-300">
              <option value="Todos" ${dashboardFilters.cota === 'Todos' ? 'selected' : ''}>Todas as Cotas</option>
              <option value="Ampla" ${dashboardFilters.cota === 'Ampla' ? 'selected' : ''}>Ampla Conc.</option>
              <option value="PN" ${dashboardFilters.cota === 'PN' ? 'selected' : ''}>Pretos/Negros</option>
              <option value="PCD" ${dashboardFilters.cota === 'PCD' ? 'selected' : ''}>PCD</option>
            </select>
            <select onchange="setFilter('intencao', this.value)" class="text-xs border border-slate-700 rounded px-2 py-1.5 bg-slate-800 text-slate-300">
              <option value="Todos" ${dashboardFilters.intencao === 'Todos' ? 'selected' : ''}>Todas as Intenções</option>
              <option value="Sim" ${dashboardFilters.intencao === 'Sim' ? 'selected' : ''}>Sim</option>
              <option value="Nao" ${dashboardFilters.intencao === 'Nao' ? 'selected' : ''}>Não</option>
              <option value="Talvez" ${dashboardFilters.intencao === 'Talvez' ? 'selected' : ''}>Talvez</option>
              <option value="Pendente" ${dashboardFilters.intencao === 'Pendente' ? 'selected' : ''}>Pendente</option>
            </select>
          </div>
        </div>
        <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
          <table class="w-full text-sm">
            <thead class="sticky top-0 bg-slate-800"><tr class="text-left text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-700"><th class="py-3 px-2 font-semibold">Ordem</th><th class="py-3 px-2 font-semibold">Candidato</th><th class="py-3 px-2 font-semibold">Cota</th><th class="py-3 px-2 font-semibold">Intenção</th><th class="py-3 px-2 font-semibold">Comarca</th></tr></thead>
            <tbody>
              ${filteredQueue.map(c => {
                const nameClass = c.status === 'Nao' ? 'declined' : '';
                return `<tr class="border-b border-slate-700 hover:bg-slate-700/30">
                  <td class="py-3 px-2 font-mono text-xs text-slate-500">${c.classificacaoGeral}º</td>
                  <td class="py-3 px-2 font-medium ${nameClass}">${c.nome}</td>
                  <td class="py-3 px-2"><span class="badge-cota-${c.cota.toLowerCase()} px-2 py-0.5 rounded text-[10px] font-medium">${c.cota}</span></td>
                  <td class="py-3 px-2"><span class="status-${c.status.toLowerCase()} px-2 py-0.5 rounded text-[10px] font-medium">${c.status}</span></td>

      <div class="grid lg:grid-cols-3 gap-6">

      </div>
    </div>
  `;
}

function renderCotaReport(cotaType, title) {
  const list = state.candidates.filter(c => c.cota === cotaType).sort((a, b) => a.classificacaoGeral - b.classificacaoGeral);
  const sim = list.filter(c => c.status === 'Sim').length;
  const nao = list.filter(c => c.status === 'Nao').length;
  const talvez = list.filter(c => c.status === 'Talvez').length;
  
  return `
    <div class="card-elevated p-5">
      <h4 class="font-display text-lg font-bold text-white mb-3">${title}</h4>
      <div class="grid grid-cols-4 gap-2 mb-4 text-center">
        <div class="bg-slate-800 rounded p-2"><div class="text-[10px] text-slate-500">Total</div><div class="font-bold text-sm">${list.length}</div></div>
        <div class="bg-green-900/30 rounded p-2"><div class="text-[10px] text-green-500">Sim</div><div class="font-bold text-sm text-green-400">${sim}</div></div>
        <div class="bg-red-900/30 rounded p-2"><div class="text-[10px] text-red-500">Não</div><div class="font-bold text-sm text-red-400">${nao}</div></div>
        <div class="bg-amber-900/30 rounded p-2"><div class="text-[10px] text-amber-500">Talvez</div><div class="font-bold text-sm text-amber-400">${talvez}</div></div>
      </div>
      <div class="max-h-96 overflow-y-auto border border-slate-700 rounded-lg">
        <table class="w-full text-xs">
          <tbody>
            ${list.map(c => `<tr class="border-b border-slate-700 ${c.status === 'Nao' ? 'declined' : ''}"><td class="py-2 px-2 font-mono text-slate-500 w-10">${c.classificacaoGeral}º</td><td class="py-2 px-2 font-medium text-slate-300">${c.nome}</td><td class="py-2 px-2 text-right"><span class="status-${c.status.toLowerCase()} px-1.5 py-0.5 rounded text-[9px]">${c.status}</span></td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function setFilter(type, value) {
  dashboardFilters[type] = value;
  render();
}

function renderCharts() {
  if (intentionsChart) { intentionsChart.destroy(); intentionsChart = null; }
  
  const intentions = {
    Sim: state.candidates.filter(c => c.status === 'Sim').length,
    Nao: state.candidates.filter(c => c.status === 'Nao').length,
    Talvez: state.candidates.filter(c => c.status === 'Talvez').length,
    Pendente: state.candidates.filter(c => c.status === 'Pendente').length
  };
  
  const intentionsCanvas = document.getElementById('intentionsChart');
  if (intentionsCanvas) {
    intentionsChart = new Chart(intentionsCanvas, {
      type: 'doughnut',
      data: { labels: ['Sim', 'Não', 'Talvez', 'Pendente'], datasets: [{ data: [intentions.Sim, intentions.Nao, intentions.Talvez, intentions.Pendente], backgroundColor: ['#22c55e', '#ef4444', '#f59e0b', '#64748b'], borderWidth: 2, borderColor: '#1e293b' }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } }, cutout: '65%' }
    });
  }
}

const ADMIN_PASSWORD = 'pombos';

function renderAdmin() {
  if (!adminAuthenticated) return renderAdminLogin();
  return renderAdminPanel();
}

function renderAdminLogin() {
  return `
    <div class="max-w-md mx-auto px-4 py-16 fade-in">
      <div class="card-elevated p-8 relative overflow-hidden">
        <div class="ornament-corner tl"></div><div class="ornament-corner tr"></div><div class="ornament-corner bl"></div><div class="ornament-corner br"></div>
        <div class="text-center mb-6">
          <div class="w-16 h-16 mx-auto rounded-full bg-slate-800 flex items-center justify-center mb-3"><svg class="w-8 h-8 text-[#c9a961]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div>
          <h1 class="font-display text-2xl font-bold text-white">Painel Administrativo</h1>
        </div>
        <div class="space-y-4">
          <input type="password" id="adminPassword" class="input-field" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter') loginAdmin()">
          <button onclick="loginAdmin()" class="btn-primary w-full py-3 rounded-lg">Acessar</button>
        </div>
      </div>
    </div>
  `;
}

function loginAdmin() {
  if (document.getElementById('adminPassword').value === ADMIN_PASSWORD) { adminAuthenticated = true; showToast('Acesso liberado.', 'success'); render(); }
  else { showToast('Senha incorreta.', 'error'); }
}

function logoutAdmin() { adminAuthenticated = false; navigate('home'); }

function renderAdminPanel() {
  return `
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
        <h1 class="font-display text-3xl font-bold text-white">Painel do Administrador</h1>
        <button onclick="logoutAdmin()" class="btn-ghost text-sm px-4 py-2 rounded">Sair</button>
      </div>
      
      <div class="card-elevated p-6 mb-6">
        <h3 class="font-display text-lg font-bold text-white mb-4">Controle de Fases</h3>
        <div class="grid sm:grid-cols-2 gap-4">
          <div class="flex items-center justify-between p-4 border border-slate-700 rounded-lg">
            <div><div class="font-semibold text-sm">Fase 1 — Intenção de Posse</div></div>
            <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" ${state.phases.phase1Open ? 'checked' : ''} onchange="togglePhase('phase1Open', this.checked)" class="sr-only peer"><div class="w-11 h-6 bg-slate-700 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div></label>
          </div>
          <div class="flex items-center justify-between p-4 border border-slate-700 rounded-lg">
            <div><div class="font-semibold text-sm">Fase 2 — Escolha de Comarca</div></div>
            <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" ${state.phases.phase2Open ? 'checked' : ''} onchange="togglePhase('phase2Open', this.checked)" class="sr-only peer"><div class="w-11 h-6 bg-slate-700 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div></label>
          </div>
        </div>
      </div>
      
      <div class="card-elevated p-6 mb-6">
        <h3 class="font-display text-lg font-bold text-white mb-2">Exportar Relatório Completo</h3>
        <p class="text-xs text-slate-400 mb-4">Exporta planilha CSV incluindo ordens, decisões, telefones e e-mails de todos os candidatos.</p>
        <button onclick="exportReport()" class="btn-primary px-4 py-2 rounded">Exportar CSV Completo</button>
      </div>
      
      <div class="card-elevated p-6">
        <h3 class="font-display text-lg font-bold text-white mb-4">Gerenciar Candidatos & Contatos</h3>
        <div class="overflow-x-auto max-h-96 overflow-y-auto border border-slate-700 rounded-lg">
          <table class="w-full text-sm">
            <thead><tr class="text-left text-[10px] uppercase tracking-wider text-slate-500 border-b border-slate-700 sticky top-0 bg-slate-800"><th class="py-3 px-2">Ordem</th><th class="py-3 px-2">Nome</th><th class="py-3 px-2">Cota</th><th class="py-3 px-2">Telefone</th><th class="py-3 px-2">E-mail</th><th class="py-3 px-2">Status</th></tr></thead>
            <tbody>
              ${state.candidates.map(c => `<tr class="border-b border-slate-700 hover:bg-slate-700/30">
                <td class="py-2 px-2 font-mono text-xs text-slate-500">${c.classificacaoGeral}º</td>
                <td class="py-2 px-2 font-medium text-slate-300">${c.nome}</td>
                <td class="py-2 px-2"><span class="badge-cota-${c.cota.toLowerCase()} px-2 py-0.5 rounded text-[10px]">${c.cota}</span></td>
                <td class="py-2 px-2 text-xs font-mono text-slate-400">${c.telefone || '—'}</td>
                <td class="py-2 px-2 text-xs text-slate-400">${c.email || '—'}</td>
                <td class="py-2 px-2"><select onchange="updateCandidateStatus('${c.id}', this.value)" class="text-xs border border-slate-700 rounded px-2 py-1 bg-slate-800 text-slate-300"><option value="Pendente" ${c.status === 'Pendente' ? 'selected' : ''}>Pendente</option><option value="Sim" ${c.status === 'Sim' ? 'selected' : ''}>Sim</option><option value="Nao" ${c.status === 'Nao' ? 'selected' : ''}>Não</option><option value="Talvez" ${c.status === 'Talvez' ? 'selected' : ''}>Talvez</option></select></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function togglePhase(phase, value) { updateState('phases/' + phase, value); }
function updateCandidateStatus(id, status) { updateState(`candidates/${id}/status`, status); }

function exportReport() {
  const sorted = [...state.candidates].sort((a, b) => a.classificacaoGeral - b.classificacaoGeral);
  const headers = ['OrdemNomeacao', 'Nome', 'Classificacao', 'Cota', 'Telefone', 'Email', 'Status', 'ComarcaEscolhida'];
  const rows = sorted.map(c => [c.classificacaoGeral, c.nome, c.classificacao, c.cota, c.telefone || '', c.email || '', c.status, c.comarcaEscolhida || '']);
  const csv = [headers.join(','), ...rows.map(r => r.map(v => `"${v}"`).join(','))].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'relatorio_tjrs_chamada.csv'; a.click();
}

initApp();
</script>
